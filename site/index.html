<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Search the plugins, skills, agents and hooks of the DevDigest Claude Code plugin marketplace.">
  <meta name="color-scheme" content="dark light">
  <script>
    // Dark first; a saved light choice wins. Runs before CSS paints to avoid a flash.
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
