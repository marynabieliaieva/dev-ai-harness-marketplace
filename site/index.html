<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevDigest Marketplace</title>
  <meta name="description" content="Search the skills, agents, commands, hooks and MCP servers of the DevDigest Claude Code plugin marketplace.">
  <meta name="color-scheme" content="dark light">
  <script>
    // Dark first; a saved light choice wins. Runs before CSS paints to avoid a flash.
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="alternate" type="application/atom+xml" title="Releases" href="public/feed.xml">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/">
        <span class="brand__mark" aria-hidden="true">dd</span>
        <span>DevDigest <span class="muted">Marketplace</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="explore">Explore</a>
        <a href="#/stack" data-nav="stack">Install builder<span class="pill" id="stack-count" hidden>0</span></a>
        <a href="#/releases" data-nav="releases">Releases</a>
      </nav>
      <button class="theme-btn" id="theme-toggle" type="button" aria-label="Switch to light theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="loading">Loading the catalog…</p>
  </main>

  <footer class="footer" id="footer">
    <div class="footer__inner">
      <span id="generated-at"></span>
      <nav aria-label="Footer">
        <a id="link-contribute" href="#" target="_blank" rel="noopener">Contribute a plugin</a>
        <a id="link-security" href="#" target="_blank" rel="noopener">Security</a>
        <a href="#/releases">Release feed</a>
      </nav>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
