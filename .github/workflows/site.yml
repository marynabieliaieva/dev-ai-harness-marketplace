name: Build catalog site

# On every pull request that can change the catalog: build the index from the repository
# and the React frontend, so a broken index or a type error never reaches main.
# Publishing happens in pages.yml after merge. See docs/SITE-SPEC.md.

on:
  pull_request:
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/build-index.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the catalog index
        run: npm run build:index

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Typecheck and build
        working-directory: site
        run: npm run build
