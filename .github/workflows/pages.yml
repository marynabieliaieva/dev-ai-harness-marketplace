name: Deploy site to GitHub Pages

# Publishes the catalog website in site/ to https://<owner>.github.io/<repo>/.
# The site is self-contained in site/ (relative URLs, hash routing), so it works
# from that subpath without a build step. One-time setup: Settings → Pages →
# Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        # serve.mjs is the local preview server, not part of the site.
        run: |
          mkdir -p _site
          rsync -a --exclude serve.mjs site/ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
